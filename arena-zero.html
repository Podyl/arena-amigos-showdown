</style></head><body><div class="app"><canvas id="game" class="game"></canvas><div id="hud" class="hud" style="display:none"><div class="top"><div class="score blue"><small>BLÅ</small><b id="blueScore">0</b></div><div class="clock" id="clock">2:00</div><div class="score red"><small>RÖD</small><b id="redScore">0</b></div></div><div id="hold" class="countdown">HÅLL KÄRNORNA: 12</div><div class="status"><div class="hp"><i id="hpbar" style="width:100%"></i></div><div class="ammo" id="ammo"><i></i><i></i><i></i></div><div class="gemcount" id="gemCount">◆ 0</div></div><div id="leftJoy" class="joy left"><div class="knob">✥</div></div><div id="rightJoy" class="joy right"><div class="knob">✦</div></div><button id="superBtn" class="super">★</button></div><div id="menu" class="menu"><div class="rays"></div><div class="brand"><span class="a">ARENA ZERO</span><span class="b">CORE RUSH</span></div><div class="mode"><b>3 MOT 3 · CORE RUSH</b><small>Samla 10 energikärnor och håll dem i 12 sekunder</small></div><div class="heroStage"><div class="glow"></div><canvas id="heroCard" class="heroCard" width="360" height="440"></canvas></div><div class="picker"><button class="pick active" data-pick="rex"><canvas width="60" height="60"></canvas>REX</button><button class="pick" data-pick="mira"><canvas width="60" height="60"></canvas>MIRA</button><button class="pick" data-pick="bolt"><canvas width="60" height="60"></canvas>BOLT</button></div><button id="play" class="play">SPELA</button></div><div id="result" class="result"><div class="box"><h1 id="resultTitle">SEGER!</h1><p id="resultText"></p><button id="again">SPELA IGEN</button></div></div></div><script>
(()=>{'use strict';
const C=document.getElementById('game'),X=C.getContext('2d'),menu=document.getElementById('menu'),hud=document.getElementById('hud'),result=document.getElementById('result');
const W=2000,H=1200,TAU=Math.PI*2,cl=(v,a,b)=>Math.max(a,Math.min(b,v)),dst=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),rnd=(a,b)=>a+Math.random()*(b-a);
const COLORS={blue:'#2d7dff',red:'#ff465b',grass:'#73d766',grass2:'#6bce60',wall:'#d79045',wallTop:'#f3bd72',bush:'#37a957',water:'#42bfe9'};
const HEROES={rex:{hp:5600,speed:315,damage:920,range:560,rate:.37,shots:1,name:'REX',body:'#ef4d48',hair:'#562f26',accent:'#ffd14a',gun:'#374b61'},mira:{hp:4300,speed:320,damage:1380,range:760,rate:.58,shots:1,name:'MIRA',body:'#6c63e8',hair:'#1d2545',accent:'#6fe7ff',gun:'#273456'},bolt:{hp:7200,speed:265,damage:760,range:470,rate:.48,shots:4,name:'BOLT',body:'#2aa6a1',hair:'#163d43',accent:'#ffc84b',gun:'#38464f'}};
let pick='rex',state=null,last=performance.now(),playing=false,shake=0,hitstop=0;
const walls=[{x:180,y:180,w:320,h:95},{x:1500,y:180,w:320,h:95},{x:180,y:925,w:320,h:95},{x:1500,y:925,w:320,h:95},{x:640,y:330,w:210,h:95},{x:1150,y:330,w:210,h:95},{x:640,y:775,w:210,h:95},{x:1150,y:775,w:210,h:95},{x:910,y:430,w:180,h:95},{x:910,y:675,w:180,h:95}];
const bushes=[{x:490,y:320,w:150,h:130},{x:1360,y:320,w:150,h:130},{x:490,y:755,w:150,h:130},{x:1360,y:755,w:150,h:130},{x:805,y:520,w:130,h:160},{x:1065,y:520,w:130,h:160}];
const waters=[{x:300,y:475,w:210,h:245},{x:1490,y:475,w:210,h:245}];
function circleRect(x,y,r,q){const nx=cl(x,q.x,q.x+q.w),ny=cl(y,q.y,q.y+q.h);return Math.hypot(x-nx,y-ny)<r}
function solid(x,y,r){if(x<r+18||y<r+18||x>W-r-18||y>H-r-18)return true;for(const q of walls)if(circleRect(x,y,r,q))return true;for(const q of waters)if(circleRect(x,y,r,q))return true;return false}
function move(f,dx,dy){const r=34;if(!solid(f.x+dx,f.y,r))f.x+=dx;if(!solid(f.x,f.y+dy,r))f.y+=dy}
function inBush(f){return bushes.some(q=>f.x>q.x&&f.x<q.x+q.w&&f.y>q.y&&f.y<q.y+q.h)}
function fighter(team,hero,x,y,human=false){const s=HEROES[hero];return{id:Math.random(),team,hero,x,y,spawnX:x,spawnY:y,human,hp:s.hp,maxHp:s.hp,ammo:3,reload:0,super:0,next:0,dead:0,aim:team==='blue'?-Math.PI/2:Math.PI/2,gems:0,flash:0,walk:0,dir:1}}
function reset(){state={fighters:[fighter('blue',pick,1000,1030,true),fighter('blue','mira',760,1015),fighter('blue','bolt',1240,1015),fighter('red','rex',1000,170),fighter('red','mira',760,185),fighter('red','bolt',1240,185)],shots:[],parts:[],numbers:[],cores:[],coreTimer:1.5,time:120,blue:0,red:0,holdTeam:null,hold:12,move:{x:0,y:0},aim:{x:0,y:-1},shoot:false};playing=true;menu.style.display='none';hud.style.display='block';result.style.display='none';last=performance.now();}
function spawnCore(){if(state.cores.length<7)state.cores.push({x:1000+rnd(-90,90),y:600+rnd(-70,70),vx:rnd(-25,25),vy:rnd(-25,25),life:999,pulse:rnd(0,6.2)})}
function shoot(f,a,now){const st=HEROES[f.hero];if(now<f.next||f.ammo<1||f.dead>0)return;f.ammo--;f.reload=0;f.next=now+st.rate;f.aim=a;const n=st.shots;for(let i=0;i<n;i++){const sp=(i-(n-1)/2)*(n>1?.12:0),aa=a+sp;state.shots.push({x:f.x+Math.cos(aa)*48,y:f.y+Math.sin(aa)*48,vx:Math.cos(aa)*920,vy:Math.sin(aa)*920,life:st.range/920,team:f.team,damage:st.damage/n,r:f.hero==='mira'?9:7});}burst(f.x+Math.cos(a)*46,f.y+Math.sin(a)*46,f.team==='blue'?'#a8d6ff':'#ffb0b8',5,160);f.flash=.12}
function burst(x,y,c,n=10,p=220){for(let i=0;i<n;i++){const a=rnd(0,TAU),s=rnd(p*.25,p);state.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.18,.42),max:.42,size:rnd(2,7),c})}}
function damage(t,d,from){if(t.dead>0)return;t.hp-=d;t.flash=.16;shake=Math.max(shake,7);hitstop=.025;state.numbers.push({x:t.x,y:t.y-58,text:'-'+Math.round(d),life:.6});burst(t.x,t.y,from==='blue'?'#9fd0ff':'#ff9ca6',10,260);if(t.hp<=0)kill(t)}
function kill(f){for(let i=0;i<f.gems;i++)state.cores.push({x:f.x+rnd(-28,28),y:f.y+rnd(-28,28),vx:rnd(-90,90),vy:rnd(-90,90),life:999,pulse:rnd(0,6.2)});f.gems=0;f.dead=3;f.hp=0;burst(f.x,f.y,'#fff',22,420);shake=15}
function superUse(f){if(f.super<100||f.dead>0)return;f.super=0;burst(f.x,f.y,'#ffe45a',28,420);shake=17;for(const e of state.fighters)if(e.team!==f.team&&e.dead<=0&&dst(f,e)<280)damage(e,1900,f.team)}
function nearestEnemy(f){let best=null,bd=1e9;for(const e of state.fighters){if(e.team===f.team||e.dead>0)continue;const d=dst(f,e);if(d<bd){bd=d;best=e}}return[best,bd]}
function bot(f,dt,now){if(f.dead>0)return;const [t,d]=nearestEnemy(f);if(!t)return;const a=Math.atan2(t.y-f.y,t.x-f.x),st=HEROES[f.hero];f.aim=a;let k=d>st.range*.62?1:d<st.range*.38?-.65:0;const str=Math.sin(now*2.2+f.id*9)*.65;let vx=Math.cos(a)*st.speed*k+Math.cos(a+Math.PI/2)*st.speed*.34*str,vy=Math.sin(a)*st.speed*k+Math.sin(a+Math.PI/2)*st.speed*.34*str;const m=Math.hypot(vx,vy)||1;move(f,vx/m*st.speed*dt,vy/m*st.speed*dt);if(d<st.range*1.02)shoot(f,a+rnd(-.055,.055),now);if(f.super>=100&&d<250)superUse(f)}
function update(dt,now){if(!playing)return;if(hitstop>0){hitstop-=dt;return}state.time-=dt;if(state.time<=0){finish(state.blue>=state.red?'blue':'red');return}state.coreTimer-=dt;if(state.coreTimer<=0){state.coreTimer=2.4;spawnCore()}const p=state.fighters[0];if(p.dead<=0){let mx=state.move.x,my=state.move.y,m=Math.hypot(mx,my);if(m>1){mx/=m;my/=m}move(p,mx*HEROES[p.hero].speed*dt,my*HEROES[p.hero].speed*dt);if(m>.1){p.walk+=dt*10;p.dir=mx<-.1?-1:mx>.1?1:p.dir}const am=Math.hypot(state.aim.x,state.aim.y);if(am>.18){p.aim=Math.atan2(state.aim.y,state.aim.x);if(state.shoot)shoot(p,p.aim,now)}if(p.ammo<3){p.reload+=dt;if(p.reload>=1.1){p.reload=0;p.ammo++}}}for(let i=1;i<state.fighters.length;i++)bot(state.fighters[i],dt,now);for(const f of state.fighters){if(f.dead>0){f.dead-=dt;if(f.dead<=0){f.dead=0;f.hp=f.maxHp;f.ammo=3;f.x=f.spawnX;f.y=f.spawnY}}else{if(f.ammo<3){f.reload+=dt;if(f.reload>=1.1){f.reload=0;f.ammo++}}if(f.hp<f.maxHp&&!f.flash)f.hp=Math.min(f.maxHp,f.hp+f.maxHp*.045*dt);f.flash=Math.max(0,f.flash-dt);for(let i=state.cores.length-1;i>=0;i--){const c=state.cores[i];if(Math.hypot(f.x-c.x,f.y-c.y)<52){f.gems++;state.cores.splice(i,1);burst(c.x,c.y,'#d99cff',10,180)}}}}
for(let i=state.shots.length-1;i>=0;i--){const q=state.shots[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;let wall=walls.some(w=>circleRect(q.x,q.y,q.r,w));if(q.life<=0||wall||q.x<0||q.y<0||q.x>W||q.y>H){state.shots.splice(i,1);continue}let hit=null;for(const f of state.fighters){if(f.team!==q.team&&f.dead<=0&&Math.hypot(q.x-f.x,q.y-f.y)<40){hit=f;break}}if(hit){damage(hit,q.damage,q.team);const owner=state.fighters.find(f=>f.team===q.team&&dst(f,q)<700);if(owner)owner.super=Math.min(100,owner.super+16);state.shots.splice(i,1)}}for(let i=state.parts.length-1;i>=0;i--){const p=state.parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.92;p.vy*=.92;p.life-=dt;if(p.life<=0)state.parts.splice(i,1)}for(let i=state.numbers.length-1;i>=0;i--){const n=state.numbers[i];n.y-=35*dt;n.life-=dt;if(n.life<=0)state.numbers.splice(i,1)}for(const c of state.cores){c.x+=c.vx*dt;c.y+=c.vy*dt;c.vx*=.96;c.vy*=.96;c.pulse+=dt*3}
state.blue=state.fighters.filter(f=>f.team==='blue').reduce((s,f)=>s+f.gems,0);state.red=state.fighters.filter(f=>f.team==='red').reduce((s,f)=>s+f.gems,0);let lead=state.blue>=10?'blue':state.red>=10?'red':null;if(lead){if(state.holdTeam!==lead){state.holdTeam=lead;state.hold=12}else state.hold-=dt;if(state.hold<=0){finish(lead);return}}else{state.holdTeam=null;state.hold=12}}
function finish(team){playing=false;hud.style.display='none';result.style.display='grid';document.getElementById('resultTitle').textContent=team==='blue'?'SEGER!':'FÖRLUST';document.getElementById('resultText').textContent=`${state.blue} - ${state.red} energikärnor`;}
function resize(){const dpr=Math.min(devicePixelRatio||1,2),r=C.getBoundingClientRect();C.width=Math.round(r.width*dpr);C.height=Math.round(r.height*dpr);X.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function rr(x,y,w,h,r){X.beginPath();X.roundRect(x,y,w,h,r)}
function world(cam,scale,fn){X.save();X.translate(innerWidth/2+shake*(Math.random()-.5),innerHeight/2+shake*(Math.random()-.5));X.scale(scale,scale);X.translate(-cam.x,-cam.y);fn();X.restore()}
function drawArena(){X.fillStyle=COLORS.grass;X.fillRect(0,0,W,H);for(let x=0;x<W;x+=120)for(let y=0;y<H;y+=120){X.fillStyle=((x/120+y/120)%2)?'#70d264':'#78db6c';X.fillRect(x,y,120,120)}X.globalAlpha=.07;X.strokeStyle='#fff';X.lineWidth=3;for(let y=20;y<H;y+=32){X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke()}X.globalAlpha=1;for(const q of waters){X.fillStyle='#268fb8';rr(q.x+8,q.y+12,q.w,q.h,28);X.fill();X.fillStyle=COLORS.water;rr(q.x,q.y,q.w,q.h,28);X.fill();X.strokeStyle='#a9efff';X.lineWidth=6;X.stroke()}for(const q of walls){X.fillStyle='#8b5b31';rr(q.x+9,q.y+14,q.w,q.h,20);X.fill();X.fillStyle=COLORS.wall;rr(q.x,q.y,q.w,q.h,20);X.fill();X.fillStyle=COLORS.wallTop;rr(q.x+7,q.y+7,q.w-14,q.h-25,16);X.fill();X.strokeStyle='#8e5d31';X.lineWidth=5;X.stroke()}for(const q of bushes){for(let i=0;i<10;i++){const a=i/10*TAU,px=q.x+q.w/2+Math.cos(a)*q.w*.34,py=q.y+q.h/2+Math.sin(a)*q.h*.28;X.fillStyle=i%2?'#2d9148':'#46b45f';X.beginPath();X.arc(px,py,37,0,TAU);X.fill()}X.fillStyle='#38a454';X.beginPath();X.ellipse(q.x+q.w/2,q.y+q.h/2,q.w*.3,q.h*.3,0,0,TAU);X.fill()}X.save();X.translate(1000,600);for(let i=0;i<3;i++){X.strokeStyle=['#7b45d3','#9c69ef','#c3a4ff'][i];X.lineWidth=8-i*2;X.globalAlpha=.22-i*.04;X.beginPath();X.arc(0,0,95+i*20,0,TAU);X.stroke()}X.globalAlpha=1;X.fillStyle='#5634a8';rr(-54,-35,108,70,18);X.fill();X.fillStyle='#bd91ff';X.beginPath();X.moveTo(0,-74);X.lineTo(36,-8);X.lineTo(0,54);X.lineTo(-36,-8);X.closePath();X.fill();X.restore()}
function drawCore(c){X.save();X.translate(c.x,c.y);const s=1+Math.sin(c.pulse)*.08;X.scale(s,s);X.shadowColor='#b96dff';X.shadowBlur=22;X.fillStyle='#8a46da';X.beginPath();X.moveTo(0,-18);X.lineTo(15,-5);X.lineTo(10,17);X.lineTo(-10,17);X.lineTo(-15,-5);X.closePath();X.fill();X.fillStyle='#e4c6ff';X.beginPath();X.moveTo(0,-13);X.lineTo(8,-4);X.lineTo(4,7);X.lineTo(-5,7);X.closePath();X.fill();X.restore()}
function drawFighter(f,cam){if(f.dead>0)return;const hidden=inBush(f)&&f.team==='red'&&dst(f,state.fighters[0])>170;if(hidden)return;const st=HEROES[f.hero],moving=Math.hypot(f.x-(f._px||f.x),f.y-(f._py||f.y))>.2;f._px=f.x;f._py=f.y;X.save();X.translate(f.x,f.y);X.fillStyle='#14203644';X.beginPath();X.ellipse(0,30,42,19,0,0,TAU);X.fill();X.strokeStyle=f.team==='blue'?COLORS.blue:COLORS.red;X.lineWidth=7;X.globalAlpha=.75;X.beginPath();X.ellipse(0,27,44,22,0,0,TAU);X.stroke();X.globalAlpha=1;const bob=moving?Math.sin(f.walk)*3:Math.sin(performance.now()/420+f.id)*1.5;X.translate(0,bob);const aim=f.aim,face=Math.cos(aim)>=0?1:-1;X.scale(face,1);if(f.flash>0){X.shadowColor='#fff';X.shadowBlur=24}X.fillStyle=st.body;rr(-29,-18,58,62,20);X.fill();X.fillStyle=st.accent;rr(-25,13,50,14,6);X.fill();X.fillStyle='#f3bf95';X.beginPath();X.arc(0,-32,27,0,TAU);X.fill();X.fillStyle=st.hair;X.beginPath();X.arc(-4,-39,25,Math.PI,TAU);X.lineTo(24,-30);X.quadraticCurveTo(9,-59,-16,-53);X.closePath();X.fill();X.fillStyle='#fff';X.beginPath();X.arc(8,-34,6,0,TAU);X.fill();X.fillStyle='#26334a';X.beginPath();X.arc(10,-34,3,0,TAU);X.fill();X.fillStyle=st.gun;rr(18,-6,42,18,8);X.fill();X.fillStyle='#233042';rr(50,-2,18,10,5);X.fill();X.fillStyle='#38495c';rr(-22,38,18,18,6);X.fill();rr(5,38,18,18,6);X.fill();X.scale(face,1);X.restore();const hp=f.hp/f.maxHp;X.fillStyle='#243249';rr(f.x-46,f.y-75,92,12,7);X.fill();X.fillStyle=f.team==='blue'?'#55ec75':'#ff5b67';rr(f.x-44,f.y-73,88*cl(hp,0,1),8,5);X.fill();X.font='900 14px Arial';X.textAlign='center';X.strokeStyle='#16213c';X.lineWidth=4;X.strokeText(st.name,f.x,f.y-84);X.fillStyle='#fff';X.fillText(st.name,f.x,f.y-84);if(f.gems){X.font='900 18px Arial';X.fillStyle='#d29cff';X.strokeStyle='#382462';X.lineWidth=4;X.strokeText('◆ '+f.gems,f.x,f.y-101);X.fillText('◆ '+f.gems,f.x,f.y-101)}}
function draw(now){if(!state){X.clearRect(0,0,innerWidth,innerHeight);return}X.clearRect(0,0,innerWidth,innerHeight);const p=state.fighters[0],scale=cl(Math.min(innerWidth/720,innerHeight/520),.72,1.15),halfW=innerWidth/(2*scale),halfH=innerHeight/(2*scale),cam={x:cl(p.x,halfW,W-halfW),y:cl(p.y,halfH,H-halfH)};world(cam,scale,()=>{drawArena();for(const c of state.cores)drawCore(c);if(Math.hypot(state.aim.x,state.aim.y)>.18&&p.dead<=0){X.save();X.translate(p.x,p.y);X.rotate(p.aim);X.fillStyle='#ffffff18';X.beginPath();X.moveTo(34,-20);X.lineTo(HEROES[p.hero].range, -52);X.lineTo(HEROES[p.hero].range,52);X.lineTo(34,20);X.closePath();X.fill();X.restore()}for(const q of state.shots){X.strokeStyle=q.team==='blue'?'#a9dcff':'#ffadb5';X.lineWidth=q.r*1.3;X.globalAlpha=.35;X.beginPath();X.moveTo(q.x-q.vx*.025,q.y-q.vy*.025);X.lineTo(q.x,q.y);X.stroke();X.globalAlpha=1;X.fillStyle=q.team==='blue'?'#65b9ff':'#ff6472';X.beginPath();X.arc(q.x,q.y,q.r,0,TAU);X.fill();X.strokeStyle='#fff';X.lineWidth=2;X.stroke()}for(const f of state.fighters)drawFighter(f,cam);for(const p of state.parts){X.globalAlpha=cl(p.life/p.max,0,1);X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,p.size,0,TAU);X.fill()}X.globalAlpha=1;for(const n of state.numbers){X.globalAlpha=cl(n.life/.35,0,1);X.font='1000 24px Arial';X.textAlign='center';X.strokeStyle='#331d26';X.lineWidth=6;X.strokeText(n.text,n.x,n.y);X.fillStyle='#fff';X.fillText(n.text,n.x,n.y)}X.globalAlpha=1});shake*=.84;if(shake<.2)shake=0;document.getElementById('blueScore').textContent=state.blue;document.getElementById('redScore').textContent=state.red;document.getElementById('clock').textContent=`${Math.floor(Math.max(0,state.time)/60)}:${String(Math.floor(Math.max(0,state.time)%60)).padStart(2,'0')}`;document.getElementById('hpbar').style.width=`${cl(p.hp/p.maxHp*100,0,100)}%`;[...document.querySelectorAll('#ammo i')].forEach((e,i)=>e.classList.toggle('on',i<p.ammo));document.getElementById('gemCount').textContent='◆ '+p.gems;const h=document.getElementById('hold');if(state.holdTeam){h.style.display='block';h.textContent=`${state.holdTeam==='blue'?'BLÅ':'RÖD'} HÅLLER 10+: ${Math.ceil(state.hold)}`}else h.style.display='none';document.getElementById('superBtn').classList.toggle('ready',p.super>=100)}
function loop(t){requestAnimationFrame(loop);let dt=Math.min(.033,(t-last)/1000||.016);last=t;update(dt,t/1000);draw(t)}requestAnimationFrame(loop);
function bindJoy(el,kind){let id=null;const knob=el.querySelector('.knob');function apply(e){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.31;let dx=e.clientX-cx,dy=e.clientY-cy,m=Math.hypot(dx,dy);if(m>max){dx=dx/m*max;dy=dy/m*max;m=max}knob.style.transform=`translate(${dx}px,${dy}px)`;const x=dx/max,y=dy/max;if(state){state[kind]={x,y};if(kind==='aim')state.shoot=m>max*.25}}function down(e){id=e.pointerId;el.setPointerCapture(id);apply(e);e.preventDefault()}function move(e){if(e.pointerId===id)apply(e)}function up(e){if(e.pointerId!==id)return;id=null;knob.style.transform='translate(0,0)';if(state){state[kind]=kind==='aim'?{x:0,y:-1}:{x:0,y:0};if(kind==='aim')state.shoot=false}}el.addEventListener('pointerdown',down);el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}bindJoy(document.getElementById('leftJoy'),'move');bindJoy(document.getElementById('rightJoy'),'aim');document.getElementById('superBtn').addEventListener('pointerdown',()=>{if(state)superUse(state.fighters[0])});
function paintHero(ctx,hero,w,h){ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(w/2,h*.58);ctx.scale(2.2,2.2);const s=HEROES[hero];ctx.fillStyle='#14203633';ctx.beginPath();ctx.ellipse(0,36,44,20,0,0,TAU);ctx.fill();ctx.fillStyle=s.body;ctx.beginPath();ctx.roundRect(-31,-15,62,68,20);ctx.fill();ctx.fillStyle=s.accent;ctx.beginPath();ctx.roundRect(-27,16,54,15,6);ctx.fill();ctx.fillStyle='#f3bf95';ctx.beginPath();ctx.arc(0,-34,30,0,TAU);ctx.fill();ctx.fillStyle=s.hair;ctx.beginPath();ctx.arc(-4,-43,28,Math.PI,TAU);ctx.lineTo(27,-31);ctx.quadraticCurveTo(10,-64,-18,-56);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(9,-36,7,0,TAU);ctx.fill();ctx.fillStyle='#26334a';ctx.beginPath();ctx.arc(11,-36,3.5,0,TAU);ctx.fill();ctx.fillStyle=s.gun;ctx.beginPath();ctx.roundRect(19,-5,48,20,8);ctx.fill();ctx.fillStyle='#34465a';ctx.beginPath();ctx.roundRect(-24,46,19,20,6);ctx.fill();ctx.beginPath();ctx.roundRect(6,46,19,20,6);ctx.fill();ctx.restore()}
function repaintMenu(){paintHero(document.getElementById('heroCard').getContext('2d'),pick,360,440);document.querySelectorAll('.pick').forEach(b=>{const k=b.dataset.pick,c=b.querySelector('canvas');paintHero(c.getContext('2d'),k,60,60)})}document.querySelectorAll('.pick').forEach(b=>b.addEventListener('click',()=>{pick=b.dataset.pick;document.querySelectorAll('.pick').forEach(x=>x.classList.toggle('active',x===b));repaintMenu()}));repaintMenu();document.getElementById('play').onclick=reset;document.getElementById('again').onclick=()=>{result.style.display='none';menu.style.display='flex';};
addEventListener('keydown',e=>{if(!state)return;const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')state.move.y=-1;if(k==='s'||k==='arrowdown')state.move.y=1;if(k==='a'||k==='arrowleft')state.move.x=-1;if(k==='d'||k==='arrowright')state.move.x=1;if(e.code==='Space'){state.shoot=true;if(Math.hypot(state.aim.x,state.aim.y)<.2)state.aim={x:0,y:-1}}if(k==='e')superUse(state.fighters[0])});addEventListener('keyup',e=>{if(!state)return;const k=e.key.toLowerCase();if((k==='w'||k==='arrowup')&&state.move.y<0)state.move.y=0;if((k==='s'||k==='arrowdown')&&state.move.y>0)state.move.y=0;if((k==='a'||k==='arrowleft')&&state.move.x<0)state.move.x=0;if((k==='d'||k==='arrowright')&&state.move.x>0)state.move.x=0;if(e.code==='Space')state.shoot=false});

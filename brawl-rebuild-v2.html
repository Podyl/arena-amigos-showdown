<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#64c8ff"><title>Arena Amigos Rebuild v2</title><style>
:root{--blue:#2c67ff;--yellow:#ffd532;--dark:#16234f}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#67c8ff;font-family:Arial,Helvetica,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.ui{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 3px 0 rgba(0,0,0,.3)}.top{position:absolute;top:max(10px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;gap:8px;align-items:center}.score,.clock{background:linear-gradient(#334f9d,#24356d);border:3px solid #fff;border-radius:18px;box-shadow:0 5px 0 rgba(17,28,65,.33);font-weight:1000}.score{padding:7px 12px;font-size:16px}.clock{padding:6px 10px;font-size:20px}.status{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);width:min(54vw,290px)}.bar{height:18px;border-radius:11px;background:#263449;border:3px solid white;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.2)}.fill{height:100%;width:100%;background:linear-gradient(#5bf37b,#19b84b)}.hptext{text-align:center;font-size:14px;font-weight:1000;margin-top:3px}.ammo{display:flex;justify-content:center;gap:5px;margin-top:5px}.ammo span{width:38px;height:9px;border:2px solid white;border-radius:8px;background:#ffbd1e;box-shadow:0 2px 0 rgba(0,0,0,.2)}.ammo span.off{background:#56627a}.joy{position:absolute;width:122px;height:122px;border-radius:50%;background:rgba(30,45,75,.22);border:4px solid rgba(255,255,255,.38);pointer-events:auto;touch-action:none}.joy .knob{position:absolute;left:29px;top:29px;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.78);border:4px solid rgba(29,42,72,.32);box-shadow:0 5px 0 rgba(0,0,0,.14);transform:translate(0,0)}#move{left:20px;bottom:max(22px,env(safe-area-inset-bottom))}#aim{right:23px;bottom:max(20px,env(safe-area-inset-bottom));background:rgba(255,73,59,.23);border-color:rgba(255,255,255,.52)}#aim .knob{background:#ff6656}.s </style></head><body><div id="game"></div><div class="start" id="start"><div class="card"><div class="logo">ARENA<br><b>AMIGOS</b></div><div class="sub">Ny 3D-version från grunden med tajtare kamera, större fighters, cover, buskar, 3 ammo och super.</div><button class="play" id="play">SPELA</button><div class="hint">Mobil: vänster spak = rörelse · höger spak = sikta/skjut · gul knapp = super</div></div></div><div class="ui"><div class="top"><div class="score">DU <b id="ps">0</b> &nbsp;•&nbsp; BOTS <b id="es">0</b></div><div class="clock" id="clock">1:30</div></div><div class="banner" id="banner">FIGHT!</div><div class="status"><div class="bar"><div class="fill" id="hpfill"></div></div><div class="hptext" id="hptext">5200</div><div class="ammo" id="ammo"><span></span><span></span><span></span></div></div><div class="joy" id="move"><div class="knob"></div></div><div class="joy" id="aim"><div class="knob"></div></div><button class="super" id="super">⚡</button><div class="crosshair" id="cross"></div></div><div class="end" id="end"><div class="card"><div class="logo" style="font-size:38px">MATCH<br><b>KLAR</b></div><div class="sub" id="result"></div><button class="again" onclick="location.reload()">SPELA IGEN</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
(()=>{const $=id=>document.getElementById(id),root=$('game');let scene,camera,renderer,clock3,player,bots=[],shots=[],fx=[],playing=false,timeLeft=90,pScore=0,eScore=0,last=0,move={x:0,y:0},aim={x:0,y:0,active:false},mouse={x:0,y:0,down:false},keys={},ammo=3,reload=0,hp=5200,superCharge=0,spawnInv=0;const obstacles=[];
function mat(c,rough=.8){return new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:.05})}const MAT={grass:mat(0x69d05d),grass2:mat(0x58bd50),wall:mat(0xd99a4c),wallTop:mat(0xf1bd70),bush:mat(0x2e9e49),bush2:mat(0x42b758),water:new THREE.MeshStandardMaterial({color:0x45bde8,roughness:.25,metalness:.08,transparent:true,opacity:.9}),blue:mat(0x3477ff),red:mat(0xff5148),skin:mat(0xffca94),dark:mat(0x27304d),yellow:mat(0xffce32),white:mat(0xffffff)};
function box(x,z,w,d,h=1.4){const g=new THREE.Group(),base=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),MAT.wall),top=new THREE.Mesh(new THREE.BoxGeometry(w*.94,.18,d*.94),MAT.wallTop);base.position.y=h/2;top.position.y=h+.07;for(const m of[base,top]){m.castShadow=m.receiveShadow=true;g.add(m)}g.position.set(x,0,z);scene.add(g);obstacles.push({x,z,w,d});return g}
function bush(x,z,s=1){const g=new THREE.Group();for(let i=0;i<7;i++){const r=.7+.25*Math.random(),m=new THREE.Mesh(new THREE.SphereGeometry(r,12,8),i%2?MAT.bush:MAT.bush2);m.scale.y=.75;m.position.set((Math.random()-.5)*1.35*s,.45+(Math.random()-.5)*.15,(Math.random()-.5)*1.35*s);m.castShadow=true;g.add(m)}g.scale.setScalar(s);g.position.set(x,0,z);scene.add(g);return g}
function fighter(color,isBot=false){const g=new THREE.Group(),body=new THREE.Mesh(new THREE.SphereGeometry(.65,18,14),mat(color)),head=new THREE.Mesh(new THREE.SphereGeometry(.48,18,14),MAT.skin),hair=new THREE.Mesh(new THREE.SphereGeometry(.5,16,10),isBot?MAT.red:MAT.blue),gun=new THREE.Mesh(new THREE.BoxGeometry(.24,.25,.85),MAT.dark),feet=[];body.scale.y=1.05;body.position.y=.88;head.position.y=1.68;hair.scale.y=.42;hair.position.set(0,1.98,-.03);gun.position.set(.47,1.05,.18);gun.rotation.x=-.18;for(const sx of[-.28,.28]){const f=new THREE.Mesh(new THREE.SphereGeometry(.25,12,8),MAT.dark);f.scale.set(1,.55,1.25);f.position.set(sx,.25,.05);feet.push(f);g.add(f)}for(const m of[body,head,hair,gun]){m.castShadow=true;m.receiveShadow=true;g.add(m)}g.userData={hp:isBot?3200:5200,max:isBot?3200:5200,bot:isBot,cd:0,respawn:0,walk:Math.random()*10,gun,feet};scene.add(g);return g}
function setup(){scene=new THREE.Scene();scene.background=new THREE.Color(0x67c8ff);scene.fog=new THREE.Fog(0x67c8ff,24,39);camera=new THREE.OrthographicCamera(-10,10,7,-7,.1,100);camera.position.set(12,18,18);camera.lookAt(0,0,0);renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;root.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x7b914c,2.5));const sun=new THREE.DirectionalLight(0xfff4d4,4.2);sun.position.set(7,15,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=18;sun.shadow.camera.bottom=-18;scene.add(sun);const floor=new THREE.Group();for(let x=-16;x<16;x+=2)for(let z=-12;z<12;z+=2){const t=new THREE.Mesh(new THREE.BoxGeometry(2,.32,2),((x+z)/2)%2?MAT.grass:MAT.grass2);t.position.set(x,-.18,z);t.receiveShadow=true;floor.add(t)}scene.add(floor);const water=new THREE.Mesh(new THREE.BoxGeometry(5,.12,2.8),MAT.water);water.position.set(0,.03,0);scene.add(water);box(-7,-4,4.6,1.5);box(7,4,4.6,1.5);box(-5,4,1.5,4.3);box(5,-4,1.5,4.3);box(0,-6.2,5.2,1.25);box(0,6.2,5.2,1.25);box(-9,1,1.4,3.6);box(9,-1,1.4,3.6);for(const [x,z,s] of[[-9,-5,1.15],[9,5,1.15],[-9,5,1.1],[9,-5,1.1],[-3,-2,1], [3,2,1],[-3,2,1],[3,-2,1]])bush(x,z,s);player=fighter(0x3a76ff,false);player.position.set(0,0,8);for(let i=0;i<4;i++){const b=fighter([0xff554c,0xe96d3c,0xef476f,0xc857e8][i],true);b.position.set((i-1.5)*3.2,0,-7+(i%2)*2);bots.push(b)}resize();window.addEventListener('resize',resize);clock3=new THREE.Clock();bindControls()}
function resize(){const w=innerWidth,h=innerHeight,asp=w/h,s=9.2;camera.left=-s*asp;camera.right=s*asp;camera.top=s;camera.bottom=-s;camera.updateProjectionMatrix();renderer.setSize(w,h)}
function bindJoy(id,target,isAim=false){const el=$(id),knob=el.querySelector('.knob');let pid=null;function apply(e){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.31,mag=Math.hypot(dx,dy)||1,k=Math.min(1,max/mag),nx=dx*k/max,ny=dy*k/max;knob.style.transform=`translate(${dx*k}px,${dy*k}px)`;target.x=nx;target.y=-ny;if(isAim)target.active=true}el.addEventListener('pointerdown',e=>{e.preventDefault();pid=e.pointerId;el.setPointerCapture(pid);apply(e)});el.addEventListener('pointermove',e=>{if(e.pointerId!==pid)return;e.preventDefault();apply(e)});const end=e=>{if(e.pointerId!==pid)return;e.preventDefault();pid=null;target.x=target.y=0;if(isAim)target.active=false;knob.style.transform='translate(0,0)'};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}
function bindControls(){bindJoy('move',move,false);bindJoy('aim',aim,true);$('super').addEventListener('pointerdown',e=>{e.preventDefault();useSuper()});$('play').addEventListener('click',()=>{start.remove();playing=true;showBanner('FIGHT!')});window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')useSuper()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);renderer.domElement.addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')mouse.down=true});window.addEventListener('pointerup',()=>mouse.down=false)}
function collide(o,nx,nz,r=.7){for(const q of obstacles)if(nx+r>q.x-q.w/2&&nx-r<q.x+q.w/2&&nz+r>q.z-q.d/2&&nz-r<q.z+q.d/2)return true;return false}
function shoot(owner,dx,dz,power=1){if(owner===player){if(ammo<1)return;ammo--;reload=0}else if(owner.userData.cd>0)return;const l=Math.hypot(dx,dz)||1;dx/=l;dz/=l;const m=new THREE.Mesh(new THREE.SphereGeometry(.22*power,10,8),owner===player?MAT.yellow:MAT.red);m.castShadow=true;m.position.copy(owner.position);m.position.y=1.15;m.position.x+=dx*.9;m.position.z+=dz*.9;scene.add(m);shots.push({m,dx,dz,owner,life:1.4,power});owner.userData.cd=.65;owner.rotation.y=Math.atan2(dx,dz);owner.scale.set(1.08,.92,1.08);setTimeout(()=>owner.scale.set(1,1,1),80)}
function burst(x,z,color=0xffd52f){for(let i=0;i<9;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.09+Math.random()*.08,6,5),mat(color));m.position.set(x,.8,z);scene.add(m);const a=Math.random()*Math.PI*2,s=2+Math.random()*3;fx.push({m,vx:Math.cos(a)*s,vz:Math.sin(a)*s,vy:2+Math.random()*2,life:.38})}}
function damage(t,d,from){t.userData.hp-=d;burst(t.position.x,t.position.z,t===player?0x65d8ff:0xff7d57);t.scale.set(.9,1.16,.9);setTimeout(()=>t.scale.set(1,1,1),90);if(t.userData.hp<=0){if(t===player)eScore++;else pScore++;t.visible=false;t.userData.respawn=2.3;t.userData.hp=t.userData.max;updateHUD()}}
function respawn(t){t.visible=true;if(t===player){t.position.set(0,0,8);hp=t.userData.hp=5200;spawnInv=1.2}else t.position.set((Math.random()-.5)*10,0,-6+Math.random()*2)}
function useSuper(){if(superCharge<100||!player.visible)return;superCharge=0;const a=player.rotation.y,dx=Math.sin(a),dz=Math.cos(a);for(let i=-2;i<=2;i++){const ang=Math.atan2(dx,dz)+i*.13;const fake={...player};shoot(player,Math.sin(ang),Math.cos(ang),1.25)}$('super').classList.remove('ready')}
function updateHUD(){$('ps').textContent=pScore;$('es').textContent=eScore;$('hpfill').style.width=Math.max(0,player.userData.hp/player.userData.max*100)+'%';$('hptext').textContent=Math.max(0,Math.ceil(player.userData.hp));[...$('ammo').children].forEach((e,i)=>e.classList.toggle('off',i>=Math.floor(ammo+.001)));$('super').classList.toggle('ready',superCharge>=100)}function showBanner(t){const b=$('banner');b.textContent=t;b.classList.add('show');setTimeout(()=>b.classList.remove('show'),900)}
function update(dt){if(!playing)return;timeLeft-=dt;if(timeLeft<=0){playing=false;$('result').textContent=pScore>eScore?'DU VANN!':pScore===eScore?'OAVGJORT':'BOTSEN VANN';$('end').classList.add('show')}const mm=Math.max(0,Math.ceil(timeLeft)),min=Math.floor(mm/60),sec=mm%60;$('clock').textContent=min+':'+String(sec).padStart(2,'0');spawnInv=Math.max(0,spawnInv-dt);let mx=move.x,my=move.y;if(keys.w||keys.arrowup)my+=1;if(keys.s||keys.arrowdown)my-=1;if(keys.a||keys.arrowleft)mx-=1;if(keys.d||keys.arrowright)mx+=1;let ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml}if(player.visible){let nx=player.position.x+mx*5.6*dt,nz=player.position.z-my*5.6*dt;if(!collide(player,nx,player.position.z))player.position.x=THREE.MathUtils.clamp(nx,-14.5,14.5);if(!collide(player,player.position.x,nz))player.position.z=THREE.MathUtils.clamp(nz,-10.5,10.5);if(ml>.08){player.userData.walk+=dt*11;player.userData.feet[0].position.z=.05+Math.sin(player.userData.walk)*.12;player.userData.feet[1].position.z=.05-Math.sin(player.userData.walk)*.12;player.position.y=Math.abs(Math.sin(player.userData.walk))*0.04}if(aim.active){const al=Math.hypot(aim.x,aim.y);if(al>.15){player.rotation.y=Math.atan2(aim.x,-aim.y);if(player.userData.cd<=0)shoot(player,aim.x,-aim.y)}}else if(mouse.down){const v=new THREE.Vector3((mouse.x/innerWidth)*2-1,-(mouse.y/innerHeight)*2+1,.5).unproject(camera),dir=v.sub(camera.position).normalize(),tt=-camera.position.y/dir.y,p=camera.position.clone().add(dir.multiplyScalar(tt));const dx=p.x-player.position.x,dz=p.z-player.position.z;if(Math.hypot(dx,dz)>.4&&player.userData.cd<=0)shoot(player,dx,dz)}}player.userData.cd=Math.max(0,player.userData.cd-dt);if(ammo<3){reload+=dt;if(reload>.95){ammo=Math.min(3,ammo+1);reload=0}}for(const b of bots){if(!b.visible){b.userData.respawn-=dt;if(b.userData.respawn<=0)respawn(b);continue}b.userData.cd=Math.max(0,b.userData.cd-dt);if(!player.visible)continue;const dx=player.position.x-b.position.x,dz=player.position.z-b.position.z,d=Math.hypot(dx,dz)||1;if(d>5.5){const nx=b.position.x+dx/d*2.2*dt,nz=b.position.z+dz/d*2.2*dt;if(!collide(b,nx,b.position.z,.65))b.position.x=nx;if(!collide(b,b.position.x,nz,.65))b.position.z=nz}b.rotation.y=Math.atan2(dx,dz);b.userData.walk+=dt*5;if(d<10&&b.userData.cd<=0)shoot(b,dx,dz)}for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.life-=dt;s.m.position.x+=s.dx*12*dt;s.m.position.z+=s.dz*12*dt;s.m.rotation.x+=dt*10;let hit=false;if(s.owner===player){for(const b of bots)if(b.visible&&s.m.position.distanceTo(b.position)<.9){damage(b,820*s.power,player);superCharge=Math.min(100,superCharge+22);hit=true;break}}else if(player.visible&&spawnInv<=0&&s.m.position.distanceTo(player.position)<.9){damage(player,520,s.owner);hit=true}if(hit||s.life<=0){scene.remove(s.m);shots.splice(i,1)}}for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.life-=dt;f.m.position.x+=f.vx*dt;f.m.position.z+=f.vz*dt;f.m.position.y+=f.vy*dt;f.vy-=8*dt;f.m.scale.setScalar(Math.max(.2,f.life/.38));if(f.life<=0){scene.remove(f.m);fx.splice(i,1)}}for(const t of[player,...bots])if(!t.visible){t.userData.respawn-=dt;if(t.userData.respawn<=0)respawn(t)}updateHUD()}
function render(){const dt=Math.min(.033,clock3.getDelta());update(dt);if(player){const target=new THREE.Vector3(player.position.x,0,player.position.z),desired=new THREE.Vector3(target.x+11.5,17,target.z+16);camera.position.lerp(desired,.08);camera.lookAt(target)}renderer.render(scene,camera);requestAnimationFrame(render)}setup();render()})();

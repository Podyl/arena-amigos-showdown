<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>NOVA CLASH</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#66c9ff;font-family:Inter,system-ui,Arial,sans-serif;touch-action:none;user-select:none}.wrap{position:fixed;inset:0}.stage{position:absolute;inset:0}.stage canvas{display:block;width:100%;height:100%}.menu{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 40%,#7fe7ff 0,#3ba2ff 34%,#265ed6 68%,#18348b 100%)}.menu:before{content:"";position:absolute;inset:-45%;background:repeating-conic-gradient(#ffffff18 0 10deg,transparent 10deg 24deg);animation:spin 28s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.logo,.card,.play{position:relative;z-index:1}.logo{text-align:center;filter:drop-shadow(0 8px 0 #10235b66)}.logo .top{display:block;font-size:clamp(34px,8vw,70px);font-weight:1000;letter-spacing:-3px;color:#fff;-webkit-text-stroke:2px #fff;text-shadow:0 6px 0 #2452b3}.logo .bot{display:block;margin-top:-10px;font-size:clamp(48px,12vw,100px);font-weight:1000;letter-spacing:-5px;color:#ffe94b;-webkit-text-stroke:3px #fff;text-shadow:0 8px 0 #a86412}.card{margin-top:18px;padding:12px 18px;border-radius:18px;border:3px solid #fff;background:#153777dd;color:#fff;text-align:center;box-shadow:0 7px 0 #10275f}.card b{display:block;font-size:19px}.card span{display:block;font-size:12px;font-weight:800;opacity:.9;margin-top:3px}.play{margin-top:24px;min-width:min(78vw,360px);padding:15px 20px;border-radius:20px;border:4px solid #fff4a5;background:linear-gradient(#ffe95e,#ffb31d);box-shadow:0 8px 0 #ad650e,0 16px 28px #0004;color:#3c2900;font-weight:1000;font-size:28px}.hud{position:absolute;inset:0;z-index:15;pointer-events:none}.score{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px}.team{min-width:80px;padding:7px 12px;border-radius:17px;border:3px solid #fff;color:#fff;text-align:center;font-weight:1000;box-shadow:0 5px 0 #0004;text-shadow:0 2px 0 #0004}.team.blue{background:linear-gradient(#67b1ff,#2875e9)}.team.red{background:linear-gradient(#ff7b8a,#dd4255)}.timer{padding:8px 12px;border:3px solid #fff;border-radius:15px;background:#253f83;color:#fff;font-weight:1000;box-shadow:0 5px 0 #15295f}.status{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);width:min(50vw,290px);text-align:center}.bar{height:18px;border:3px solid #fff;border-radius:12px;background:#1e2b47;overflow:hidden;box-shadow:0 4px 0 #0003}.bar i{display:block;height:100%;width:100%;background:linear-gradient(#72f08b,#20bd4d)}.ammo{display:flex;justify-content:center;gap:6px;margin-top:6px}.ammo i{width:44px;height:11px;border:2px solid #fff;border-radius:8px;background:#49576c}.ammo i.on{background:linear-gradient(#ffe66c,#ffae16)}.gems{margin-top:3px;color:#fff;font-size:14px;font-weight:1000;text-shadow:0 2px 0 #233}.joy{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));width:118px;height:118px;border-radius:50%;pointer-events:auto;border:4px solid #ffffff66;background:#1e315a28;box-shadow:inset 0 0 0 8px #ffffff10}.joy.left{left:18px}.joy.right{right:18px;background:#ff455526}.knob{position:absolute;width:54px;height:54px;left:28px;top:28px;border-radius:50%;border:4px solid #ffffffcc;background:#ffffffea;box-shadow:0 5px 0 #0002;pointer-events:none}.right .knob{background:linear-gradient(#ff8a80,#ef4554)}.super{position:absolute;right:134px;bottom:128px;width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:radial-gradient(circle at 32% 25%,#fff9bd 0 13%,#ffd83d 14% 52%,#f79718 53%);box-shadow:0 7px 0 #9d5a0d;font-size:30px;pointer-events:auto}.super.ready{animation:pulse .5s alternate infinite}@keyframes pulse{to{transform:scale(1.1);filter:brightness(1.15)}}.result{position:absolute;inset:0;z-index:40;display:none;place-items:center;background:#0c1739dd}.result .box{width:min(86vw,380px);padding:28px;border-radius:28px;border:5px solid #fff;background:linear-gradient(#466cd1,#293f8f);text-align:center;color:#fff;box-shadow:0 12px 0 #101b44}.result h1{margin:0;font-size:44px;color:#ffe44a;text-shadow:0 5px 0 #8e5810}.result button{margin-top:8px;border:0;border-radius:14px;padding:13px 24px;background:linear-gradient(#ffe45d,#ffad1c);box-shadow:0 6px 0 #ad650f;font-size:18px;font-weight:1000}@media(max-width:520px){.joy{width:106px;height:106px}.knob{width:48px;height:48px;left:25px;top:25px}.super{right:121px;bottom:118px;width:68px;height:68px}.status{bottom:98px}.team{min-width:68px;padding:6px 9px}}</style></head><body><div class="wrap"><div id="stage" class="stage"></div><div id="hud" class="hud" style="display:none"><div class="score"><div class="team blue">BLÅ <b id="blue">0</b></div><div class="timer" id="timer">1:30</div><div class="team red">RÖD <b id="red">0</b></div></div><div class="status"><div class="bar"><i id="hp"></i></div><div class="ammo"><i class="on"></i><i class="on"></i><i class="on"></i></div><div class="gems" id="gems">◆ 0</div></div><div id="moveJoy" class="joy left"><div class="knob"></div></div><div id="aimJoy" class="joy right"><div class="knob"></div></div><button id="super" class="super">★</button></div><div id="menu" class="menu"><div class="logo"><span class="top">NOVA</span><span class="bot">CLASH</span></div><div class="card"><b>3 MOT 3 · CRYSTAL RUSH</b><span>Ta kontroll över mitten och håll 10 kristaller</span></div><button id="play" class="play">SPELA</button></div><div id="result" class="result"><div class="box"><h1 id="resultTitle">SEGER!</h1><p id="resultText"></p><button id="again">SPELA IGEN</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script><script>(()=>{'use strict';const THREE=window.THREE;const stage=document.getElementById('stage'),hud=document.getElementById('hud'),menu=document.getElementById('menu'),result=document.getElementById('result');const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const rand=(a,b)=>a+Math.random()*(b-a);let playing=false,last=performance.now(),W=null,assets={};function renderer(){const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio||1,2));r.setSize(innerWidth,innerHeight);r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.18;stage.innerHTML='';stage.appendChild(r.domElement);return r}function load(url){return new Promise(res=>{new THREE.GLTFLoader().load(url,g=>res(g.scene),undefined,()=>res(null))})}async function loadAssets(){const base='public/kenney-mini-arena/Models/GLB%20format/';const names=['character-soldier','wall','wall-corner','tree','column','block','bricks','statue','floor-detail'];for(const n of names)assets[n]=await load(base+n+'.glb')}function clone(name,scale=1){const a=assets[name];if(!a)return null;const c=a.clone(true);c.scale.setScalar(scale);c.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});return c}function addAsset(scene,name,x,z,scale=1,rot=0){const a=clone(name,scale);if(!a)return;a.position.set(x,0,z);a.rotation.y=rot;scene.add(a);return a}function makeFighter(team='blue'){const g=new THREE.Group();const ring=new THREE.Mesh(new THREE.RingGeometry(.72,.9,40),new THREE.MeshBasicMaterial({color:team==='blue'?0x2c7dff:0xff4255,side:THREE.DoubleSide,transparent:true,opacity:.95}));ring.rotation.x=-Math.PI/2;ring.position.y=.03;g.add(ring);const sh=new THREE.Mesh(new THREE.CircleGeometry(.75,32),new THREE.MeshBasicMaterial({color:0x142034,transparent:true,opacity:.18,depthWrite:false}));sh.rotation.x=-Math.PI/2;sh.scale.y=.55;sh.position.y=.04;g.add(sh);const model=clone('character-soldier',1.32);if(model){model.position.y=.03;g.add(model)}else{const body=new THREE.Mesh(new THREE.CapsuleGeometry(.45,.7,8,12),new THREE.MeshToonMaterial({color:team==='blue'?0x3289ff:0xff4d5e}));body.position.y=1;body.castShadow=true;g.add(body)}g.userData={team,hp:5200,maxHp:5200,ammo:3,reload:0,next:0,dead:0,gems:0,super:0};return g}function buildWorld(){const r=renderer(),scene=new THREE.Scene();scene.background=new THREE.Color(0x86d8ff);scene.fog=new THREE.Fog(0x86d8ff,24,40);const cam=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,100);cam.position.set(0,12.5,10.5);cam.lookAt(0,0,0);scene.add(new THREE.HemisphereLight(0xeaf7ff,0x55734c,2.5));const sun=new THREE.DirectionalLight(0xfff0d0,4.8);sun.position.set(-7,14,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=18;sun.shadow.camera.bottom=-18;scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(28,18),new THREE.MeshStandardMaterial({color:0x72cf63,roughness:.92}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const stripeMat=new THREE.MeshBasicMaterial({color:0x8ce17f,transparent:true,opacity:.12});for(let x=-12;x<=12;x+=2){const s=new THREE.Mesh(new THREE.PlaneGeometry(.08,18),stripeMat);s.rotation.x=-Math.PI/2;s.position.set(x,.012,0);scene.add(s)}for(let z=-7;z<=7;z+=2){const s=new THREE.Mesh(new THREE.PlaneGeometry(28,.08),stripeMat);s.rotation.x=-Math.PI/2;s.position.set(0,.013,z);scene.add(s)}const blocks=[];const defs=[[-8,-4,0],[-8,4,0],[8,-4,Math.PI],[8,4,Math.PI],[-4,-1.8,0],[-4,1.8,0],[4,-1.8,Math.PI],[4,1.8,Math.PI],[0,-5.4,Math.PI/2],[0,5.4,-Math.PI/2]];for(const [x,z,rot] of defs){let obj=addAsset(scene,'wall',x,z,1.65,rot);if(!obj){obj=new THREE.Mesh(new THREE.BoxGeometry(3.2,1.1,1.3),new THREE.MeshToonMaterial({color:0xc78d55}));obj.position.set(x,.55,z);scene.add(obj)}blocks.push({x,z,w:3.1,d:1.4})}for(const [x,z,s] of [[-11,-6,1.4],[11,6,1.4],[-11,6,1.2],[11,-6,1.2],[-7,0,1.1],[7,0,1.1]])addAsset(scene,'tree',x,z,s,rand(0,6.2));for(const [x,z] of [[-2.4,-4.6],[2.4,4.6],[-2.4,4.6],[2.4,-4.6]])addAsset(scene,'column',x,z,1.25,rand(0,6.2));addAsset(scene,'statue',0,0,1.15,Math.PI);const portal=new THREE.Mesh(new THREE.TorusGeometry(1.25,.15,14,40),new THREE.MeshStandardMaterial({color:0xa96aff,emissive:0x7d39ff,emissiveIntensity:2}));portal.rotation.x=Math.PI/2;portal.position.y=.1;scene.add(portal);const fighters=[];const player=makeFighter('blue');player.position.set(0,0,6.8);fighters.push(player);scene.add(player);for(const [x,z,t] of [[-3,6.5,'blue'],[3,6.5,'blue'],[-3,-6.5,'red'],[0,-6.8,'red'],[3,-6.5,'red']]){const f=makeFighter(t);f.position.set(x,0,z);fighters.push(f);scene.add(f)}const gems=[];for(let i=0;i<5;i++){const gem=new THREE.Mesh(new THREE.OctahedronGeometry(.28),new THREE.MeshStandardMaterial({color:0xa95cff,emissive:0x8c3dff,emissiveIntensity:1.6,roughness:.25}));gem.position.set(rand(-1.2,1.2),.55,rand(-1,1));gem.castShadow=true;gem.userData.spin=rand(0,6.2);gems.push(gem);scene.add(gem)}W={r,scene,cam,blocks,fighters,player,gems,shots:[],move:{x:0,y:0},aim:{x:0,y:-1},shoot:false,time:90,blue:0,red:0};return W}function coll(x,z){if(Math.abs(x)>13||Math.abs(z)>8)return true;for(const b of W.blocks)if(x>b.x-b.w/2-.55&&x<b.x+b.w/2+.55&&z>b.z-b.d/2-.55&&z<b.z+b.d/2+.55)return true;return false}function move(f,dx,dz){const nx=f.position.x+dx;if(!coll(nx,f.position.z))f.position.x=nx;const nz=f.position.z+dz;if(!coll(f.position.x,nz))f.position.z=nz}function shoot(f,ang){const now=performance.now()/1000;if(now<f.userData.next||f.userData.ammo<1||f.userData.dead>0)return;f.userData.next=now+.38;f.userData.ammo--;f.userData.reload=0;const q=new THREE.Mesh(new THREE.SphereGeometry(.17,12,10),new THREE.MeshStandardMaterial({color:f.userData.team==='blue'?0x73c8ff:0xff8792,emissive:f.userData.team==='blue'?0x2f8dff:0xff4055,emissiveIntensity:2.3}));q.position.set(f.position.x,.9,f.position.z);q.userData={vx:Math.sin(ang)*12.5,vz:Math.cos(ang)*12.5,life:1.15,team:f.userData.team,owner:f};q.add(new THREE.PointLight(f.userData.team==='blue'?0x4da5ff:0xff4c62,2.2,3));W.scene.add(q);W.shots.push(q)}function damage(f,n){f.userData.hp-=n;f.userData.super=clamp(f.userData.super+18,0,100);if(f.userData.hp<=0){f.userData.dead=3;f.visible=false;f.userData.gems=0}}function update(dt,t){const p=W.player;if(p.userData.dead<=0){const m=Math.hypot(W.move.x,W.move.y);if(m>.08){move(p,W.move.x/m*6.2*dt,W.move.y/m*6.2*dt);p.rotation.y=Math.atan2(W.move.x,W.move.y)}const a=Math.hypot(W.aim.x,W.aim.y);if(a>.14){const ang=Math.atan2(W.aim.x,W.aim.y);p.rotation.y=ang;if(W.shoot)shoot(p,ang)}}for(const f of W.fighters){if(f.userData.dead>0){f.userData.dead-=dt;if(f.userData.dead<=0){f.visible=true;f.userData.hp=f.userData.maxHp;f.position.set(rand(-3,3),0,f.userData.team==='blue'?6.6:-6.6)}}if(f.userData.ammo<3){f.userData.reload+=dt;if(f.userData.reload>1.0){f.userData.reload=0;f.userData.ammo++}}if(f!==p&&f.userData.dead<=0){const enemies=W.fighters.filter(e=>e.userData.team!==f.userData.team&&e.userData.dead<=0);let target=null,best=99;for(const e of enemies){const d=f.position.distanceTo(e.position);if(d<best){best=d;target=e}}if(target){const dx=target.position.x-f.position.x,dz=target.position.z-f.position.z,len=Math.hypot(dx,dz)||1,ang=Math.atan2(dx,dz);f.rotation.y=ang;if(best>4.2)move(f,dx/len*3.3*dt,dz/len*3.3*dt);else if(best<2.7)move(f,-dx/len*2.2*dt,-dz/len*2.2*dt);if(best<8)shoot(f,ang+rand(-.06,.06))}}}for(let i=W.shots.length-1;i>=0;i--){const s=W.shots[i];s.position.x+=s.userData.vx*dt;s.position.z+=s.userData.vz*dt;s.userData.life-=dt;let rm=s.userData.life<=0||coll(s.position.x,s.position.z);if(!rm)for(const f of W.fighters){if(f.userData.team===s.userData.team||f.userData.dead>0)continue;if(f.position.distanceTo(s.position)<.75){damage(f,900);rm=true;break}}if(rm){W.scene.remove(s);W.shots.splice(i,1)}}for(const g of W.gems){g.userData.spin+=dt*2.8;g.rotation.y=g.userData.spin;g.position.y=.52+Math.sin(g.userData.spin*1.8)*.08;if(g.visible)for(const f of W.fighters){if(f.userData.dead<=0&&f.position.distanceTo(g.position)<.9){f.userData.gems++;g.visible=false;setTimeout(()=>{g.position.set(rand(-1.2,1.2),.55,rand(-1,1));g.visible=true},2400);break}}}W.blue=W.fighters.filter(f=>f.userData.team==='blue').reduce((a,f)=>a+f.userData.gems,0);W.red=W.fighters.filter(f=>f.userData.team==='red').reduce((a,f)=>a+f.userData.gems,0);W.time-=dt;if(W.time<=0||W.blue>=10||W.red>=10){playing=false;document.getElementById('resultTitle').textContent=W.blue>=W.red?'SEGER!':'FÖRLUST';document.getElementById('resultText').textContent=W.blue+' - '+W.red;result.style.display='grid'}const camTarget=new THREE.Vector3(p.position.x,11.8,p.position.z+8.8);W.cam.position.lerp(camTarget,1-Math.pow(.003,dt));W.cam.lookAt(p.position.x,0,p.position.z-.8);document.getElementById('blue').textContent=W.blue;document.getElementById('red').textContent=W.red;document.getElementById('timer').textContent=Math.floor(Math.max(0,W.time)/60)+':'+String(Math.floor(Math.max(0,W.time)%60)).padStart(2,'0');document.getElementById('hp').style.width=clamp(p.userData.hp/p.userData.maxHp*100,0,100)+'%';document.getElementById('gems').textContent='◆ '+p.userData.gems;document.querySelectorAll('.ammo i').forEach((e,i)=>e.classList.toggle('on',i<p.userData.ammo));document.getElementById('super').classList.toggle('ready',p.userData.super>=100)}function loop(now){requestAnimationFrame(loop);if(!playing||!W)return;const dt=Math.min(.033,(now-last)/1000||.016);last=now;update(dt,now/1000);W.r.render(W.scene,W.cam)}requestAnimationFrame(loop);function stick(id,key){const el=document.getElementById(id),knob=el.querySelector('.knob');let pid=null;const u=e=>{if(pid!==e.pointerId)return;const r=el.getBoundingClientRect();let x=(e.clientX-(r.left+r.width/2))/(r.width*.36),y=(e.clientY-(r.top+r.height/2))/(r.height*.36),m=Math.hypot(x,y);if(m>1){x/=m;y/=m}knob.style.transform=`translate(${x*27}px,${y*27}px)`;if(W){W[key]={x,y};if(key==='aim')W.shoot=m>.22}};el.onpointerdown=e=>{pid=e.pointerId;el.setPointerCapture(pid);u(e)};el.onpointermove=u;const end=e=>{if(pid!==e.pointerId)return;pid=null;knob.style.transform='translate(0,0)';if(W){W[key]=key==='aim'?{x:0,y:-1}:{x:0,y:0};if(key==='aim')W.shoot=false}};el.onpointerup=end;el.onpointercancel=end;el.onlostpointercapture=end}stick('moveJoy','move');stick('aimJoy','aim');document.getElementById('super').onpointerdown=()=>{if(!W)return;const p=W.player;if(p.userData.super<100)return;p.userData.super=0;for(const f of W.fighters)if(f.userData.team!==p.userData.team&&f.userData.dead<=0&&p.position.distanceTo(f.position)<4)damage(f,1700);const ring=new THREE.Mesh(new THREE.RingGeometry(.8,4,48),new THREE.MeshBasicMaterial({color:0xffdf4d,transparent:true,opacity:.7,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.copy(p.position);ring.position.y=.08;W.scene.add(ring);let s=.2;const id=setInterval(()=>{s+=.15;ring.scale.setScalar(s);ring.material.opacity*=.84;if(s>1){clearInterval(id);W.scene.remove(ring)}},16)};function start(){W=buildWorld();playing=true;menu.style.display='none';hud.style.display='block';result.style.display='none';last=performance.now()}document.getElementById('play').onclick=start;document.getElementById('again').onclick=start;addEventListener('resize',()=>{if(W){W.r.setSize(innerWidth,innerHeight);W.cam.aspect=innerWidth/innerHeight;W.cam.updateProjectionMatrix()}});loadAssets()})();</script></body></html>

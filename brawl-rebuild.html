<!doctype html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#6cc7ff" />
<title>Arena Amigos Rebuild</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#66c7ff;font-family:Arial,Helvetica,sans-serif;touch-action:none}*{box-sizing:border-box}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 4px rgba(0,0,0,.4)}.top{position:absolute;top:max(12px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;gap:10px;align-items:center}.score{display:flex;gap:8px;background:rgba(28,38,77,.82);border:3px solid rgba(255,255,255,.8);border-radius:22px;padding:7px 14px;font-size:18px;font-weight:900;box-shadow:0 5px 0 rgba(20,31,65,.35)}.pill{min-width:36px;text-align:center}.timer{font-size:22px;font-weight:1000;background:rgba(28,38,77,.9);border:3px solid #fff;border-radius:18px;padding:6px 11px}.hp{position:absolute;left:50%;transform:translateX(-50%);bottom:106px;width:min(48vw,260px)}.hpTrack{height:17px;background:#263246;border:3px solid white;border-radius:12px;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.2)}.hpFill{height:100%;background:linear-gradient(#44f17a,#15b44d);width:100%;transition:width .12s linear}.hpText{text-align:center;font-size:14px;font-weight:900;margin-top:4px}.ammo{display:flex;justify-content:center;gap:6px;margin-top:5px}.ammo i{display:block;width:34px;height:9px;border-radius:8px;background:#ffbf22;border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 0 rgba(0,0,0,.18)}.ammo i.off{background:#556174}.stick{position:absolute;width:118px;height:118px;border-radius:50%;background:rgba(38,52,83,.25);border:4px solid rgba(255,255,255,.3);pointer-events:auto;touch-action:none}.stick:after{content:"";position:absolute;width:58px;height:58px;left:26px;top:26px;border-radius:50%;background:rgba(255,255,255,.75);border:4px solid rgba(42,55,86,.35);box-shadow:0 4px 0 rgba(0,0,0,.15)}#move{left:22px;bottom:max(24px,env(safe-area-inset-bottom))}#aim{right:28px;bottom:max(20px,env(safe-area-inset-bottom));background:rgba(255,80,64,.26);border-color:rgba(255,255,255,.5)}#aim:after{background:#ff6856}.super{position:absolute;right:136px;bottom:128px;width:74px;height:74px;border-radius:50%;pointer-events:auto;background:radial-gradient(circle at 34% 30%,#fff69e 0 9%,#ffd936 10% 43%,#ff9c22 44% 100%);border:5px solid white;box-shadow:0 6px 0 rgba(140,74,0,.35);font-size:28px;display:grid;place-items:center;font-weight:1000;color:#553700;text-shadow:none}.super.ready{animation:pulse .7s infinite alternate}@keyframes pulse{to{transform:scale(1.08);filter:brightness(1.18)}}.banner{position:absolute;left:50%;top:17%;transform:translateX(-50%);font-size:36px;font-weight:1000;letter-spacing:1px;opacity:0;transition:.2s}.banner.show{opacity:1;transform:translateX(-50%) scale(1.08)}.start{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#60cbff 0 48%,#66d867 48%);z-index:10}.card{width:min(92vw,430px);background:linear-gradient(180deg,#304c9e,#26366c);border:5px solid #fff;border-radius:30px;padding:28px 24px 24px;color:white;text-align:center;box-shadow:0 12px 0 rgba(20,32,74,.28)}.logo{font-weight:1000;font-size:46px;line-height:.88;letter-spacing:-2px;text-shadow:0 5px 0 #1a2e68,0 8px 0 rgba(0,0,0,.16)}.logo span{color:#ffd838}.sub{margin:16px auto 20px;max-width:320px;font-size:16px;font-weight:700;line-height:1.35}.play{pointer-events:auto;border:0;background:linear-gradient(#ffe34f,#ffae1f);color:#332208;font-weight:1000;font-size:26px;padding:15px 40px;border-radius:18px;box-shadow:0 7px 0 #c96a0b,0 0 0 4px white;cursor:pointer}.tiny{font-size:12px;opacity:.84;margin-top:16px;font-weight:700}.end{position:fixed;inset:0;display:none;place-items:center;background:rgba(22,29,62,.72);z-index:12}.end.show{display:grid}.endbox{background:#314a9b;border:5px solid white;border-radius:28px;padding:28px;text-align:center;color:white;width:min(88vw,360px);box-shadow:0 12px 0 rgba(0,0,0,.2)}.endbox h2{font-size:34px;margin:0 0 8px}.endbox button{border:0;background:#ffd436;font-size:22px;font-weight:1000;border-radius:15px;padding:13px 25px;box-shadow:0 5px 0 #c7770a}.desktopHelp{position:absolute;left:14px;top:14px;background:rgba(25,35,68,.55);padding:8px 10px;border-radius:12px;font-size:12px;font-weight:700}@media(max-width:600px){.desktopHelp{display:none}.hp{bottom:112px}.banner{font-size:28px}.super{right:132px;bottom:130px;width:68px;height:68px}.stick{width:110px;height:110px}.stick:after{left:24px;top:24px;width:54px;height:54px}}
</style>
</head>
<body>
<div id="game"></div>
<div class="start" id="start"><div class="card"><div class="logo">ARENA<br><span>AMIGOS</span></div><div class="sub">Ett helt nytt 3D-brawler-spel byggt från grunden. Kort match, ammo, super, buskar, cover och bots.</div><button class="play" id="play">SPELA</button><div class="tiny">Mobil: vänster spak = rörelse · höger = sikta/skjut · gul knapp = super</div></div></div>
<div class="hud">
<div class="top"><div class="score"><span>DU <b class="pill" id="pScore">0</b></span><span>•</span><span>BOTS <b class="pill" id="eScore">0</b></span></div><div class="timer" id="timer">1:30</div></div>
<div class="desktopHelp">WASD · håll musknapp för att skjuta · E = super</div>
<div class="banner" id="banner">FIGHT!</div>
<div class="hp"><div class="hpTrack"><div class="hpFill" id="hpFill"></div></div><div class="hpText" id="hpText">5200</div><div class="ammo" id="ammo"><i></i><i></i><i></i></div></div>
<div class="stick" id="move"></div><div class="stick" id="aim"></div><button class="super" id="super">⚡</button>
</div>
<div class="end" id="end"><div class="endbox"><h2 id="endTitle">SEGER!</h2><p id="endText"></p><button id="again">SPELA IGEN</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const gameEl=document.getElementById('game');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;gameEl.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x75d4ff);scene.fog=new THREE.Fog(0x75d4ff,35,60);
const camera=new THREE.PerspectiveCamera(37,innerWidth/innerHeight,.1,100);camera.position.set(0,25,22);camera.lookAt(0,0,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x6f9a4b,2.6));const sun=new THREE.DirectionalLight(0xffffff,3.1);sun.position.set(-12,22,9);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-24;sun.shadow.camera.right=24;sun.shadow.camera.top=24;sun.shadow.camera.bottom=-24;scene.add(sun);
const MAT=(c,rough=.65)=>new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:.02});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(44,34),MAT(0x79da6c));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const borderMat=MAT(0x4da553);for(const [x,z,w,d] of [[0,-17,44,1],[0,17,44,1],[-22,0,1,34],[22,0,1,34]]){const m=new THREE.Mesh(new THREE.BoxGeometry(w,1.2,d),borderMat);m.position.set(x,.55,z);m.castShadow=m.receiveShadow=true;scene.add(m)}
const deco=new THREE.Group();scene.add(deco);
function box(x,z,w,d,c=0xd98948,h=1.7){const base=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),MAT(c));base.position.set(x,h/2,z);base.castShadow=base.receiveShadow=true;scene.add(base);const top=new THREE.Mesh(new THREE.BoxGeometry(w*.96,.16,d*.96),MAT(0xf3b76f));top.position.set(x,h+.08,z);top.castShadow=true;scene.add(top);return {x,z,w,d,h}}
const walls=[box(-10,-6,6,2),box(9,-6,5,2),box(-11,6,5,2),box(10,6,6,2),box(0,0,4,4,0xce7b42,1.9),box(0,-11,7,2),box(0,11,7,2)];
function bush(x,z,s=1){const g=new THREE.Group();for(let i=0;i<7;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.85*s,12,9),MAT(i%2?0x35a94a:0x45c45a));m.position.set((Math.random()-.5)*2.2*s,.55+Math.random()*.25,(Math.random()-.5)*2*s);m.scale.set(1,.75,1);m.castShadow=true;g.add(m)}g.position.set(x,0,z);scene.add(g);return {x,z,r:2.15*s,group:g}}
const bushes=[bush(-16,-10,1.2),bush(16,-10,1.2),bush(-16,10,1.2),bush(16,10,1.2),bush(-6,0,.9),bush(6,0,.9)];
function water(x,z,w,d){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshStandardMaterial({color:0x48b9ed,roughness:.2,metalness:.05,transparent:true,opacity:.92}));m.rotation.x=-Math.PI/2;m.position.set(x,.025,z);scene.add(m);return {x,z,w,d}}
water(-16,0,5,7);water(16,0,5,7);
for(let i=0;i<35;i++){const peb=new THREE.Mesh(new THREE.CylinderGeometry(.08+.13*Math.random(),.12+.16*Math.random(),.08,8),MAT(0xd8cc8f));peb.position.set((Math.random()-.5)*40,.05,(Math.random()-.5)*30);peb.rotation.y=Math.random()*6.28;deco.add(peb)}
function makeFighter(team=0){const g=new THREE.Group();const primary=team===0?0x3a7dff:0xff4c55, secondary=team===0?0x173c99:0x9e1d35, skin=0xffc59e;const shadow=new THREE.Mesh(new THREE.CircleGeometry(1.05,24),new THREE.MeshBasicMaterial({color:0x1c2b2f,transparent:true,opacity:.22,depthWrite:false}));shadow.rotation.x=-Math.PI/2;shadow.position.y=.035;g.add(shadow);const legs=[];for(const x of [-.34,.34]){const l=new THREE.Mesh(new THREE.CapsuleGeometry(.25,.65,5,10),MAT(0x26355a));l.position.set(x,.65,0);l.rotation.z=.03*(x>0?1:-1);l.castShadow=true;g.add(l);legs.push(l)}const body=new THREE.Mesh(new THREE.CapsuleGeometry(.72,1.05,8,16),MAT(primary,.5));body.position.y=1.55;body.castShadow=true;g.add(body);const belt=new THREE.Mesh(new THREE.TorusGeometry(.62,.11,8,24),MAT(0xffd646));belt.rotation.x=Math.PI/2;belt.position.y=1.33;g.add(belt);const head=new THREE.Mesh(new THREE.SphereGeometry(.62,18,14),MAT(skin,.58));head.position.set(0,2.72,0);head.castShadow=true;g.add(head);const hair=new THREE.Mesh(new THREE.SphereGeometry(.65,18,10,0,Math.PI*2,0,Math.PI*.55),MAT(secondary,.7));hair.position.set(0,2.88,-.02);hair.rotation.x=.08;g.add(hair);const gun=new THREE.Group();const barrel=new THREE.Mesh(new THREE.BoxGeometry(.36,.38,1.35),MAT(0x3e4855,.35));barrel.position.set(.78,1.72,.55);barrel.castShadow=true;gun.add(barrel);const muzzle=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.32,12),MAT(0x252a31,.3));muzzle.rotation.x=Math.PI/2;muzzle.position.set(.78,1.72,1.31);gun.add(muzzle);g.add(gun);return {g,body,head,gun,legs,team,hp:5200,maxHp:5200,ammo:3,reload:0,super:0,dead:false,respawn:0,vel:new THREE.Vector3(),aim:new THREE.Vector3(0,0,1),lastShot:0,ai:0,score:0,flash:0}}
const player=makeFighter(0);scene.add(player.g);player.g.position.set(0,0,12);
const bots=[];for(let i=0;i<3;i++){const b=makeFighter(1);b.g.position.set([-9,0,9][i],0,-11+(i%2)*2);scene.add(b.g);bots.push(b)}
const projectiles=[],particles=[];const projGeo=new THREE.SphereGeometry(.25,10,8),pMat=MAT(0xffd94b,.25),eMat=MAT(0xff6370,.25);
function collides(x,z,r=.78){if(Math.abs(x)>20.5||Math.abs(z)>15.5)return true;for(const w of walls)if(Math.abs(x-w.x)<w.w/2+r&&Math.abs(z-w.z)<w.d/2+r)return true;return false}
function shoot(f,dir,isSuper=false){if(f.dead)return;if(!isSuper){if(f.ammo<=0||performance.now()-f.lastShot<220)return;f.ammo--;f.reload=0;f.lastShot=performance.now()}else{if(f.super<100)return;f.super=0}const count=isSuper?7:1;for(let n=0;n<count;n++){const a=Math.atan2(dir.x,dir.z)+(isSuper?(n-(count-1)/2)*.16:0);const d=new THREE.Vector3(Math.sin(a),0,Math.cos(a));const m=new THREE.Mesh(isSuper?new THREE.SphereGeometry(.36,12,10):projGeo,f.team===0?pMat:eMat);m.castShadow=true;m.position.copy(f.g.position).add(new THREE.Vector3(d.x*1.2,1.55,d.z*1.2));scene.add(m);projectiles.push({m,d,team:f.team,life:1.35,damage:isSuper?720:960,speed:isSuper?18:20,owner:f})}f.g.scale.set(1.08,.93,1.08);setTimeout(()=>f.g.scale.set(1,1,1),80)}
function burst(pos,color){for(let i=0;i<10;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.08+Math.random()*.08,6,5),new THREE.MeshBasicMaterial({color}));m.position.copy(pos);scene.add(m);particles.push({m,v:new THREE.Vector3((Math.random()-.5)*5,Math.random()*4,(Math.random()-.5)*5),life:.45})}}
function damage(t,amount,attacker){if(t.dead)return;t.hp-=amount;t.flash=.12;burst(t.g.position.clone().add(new THREE.Vector3(0,1.4,0)),attacker.team===0?0xffe34d:0xff6671);attacker.super=Math.min(100,attacker.super+16);if(t.hp<=0){t.dead=true;t.g.visible=false;t.respawn=3;if(attacker.team===0)player.score++;else attacker.score++;document.getElementById(attacker.team===0?'pScore':'eScore').textContent=attacker.team===0?player.score:bots.reduce((s,b)=>s+b.score,0)}}
const move={x:0,y:0}, aim={x:0,y:0,active:false};let keys={};let running=false,timeLeft=90,last=performance.now();
function bindStick(id,target,isAim=false){const el=document.getElementById(id);let pid=null,cx=0,cy=0;function set(e){const dx=e.clientX-cx,dy=e.clientY-cy,l=Math.hypot(dx,dy)||1,m=Math.min(1,l/42);target.x=dx/l*m;target.y=dy/l*m;if(isAim){target.active=true;if(m>.22)shoot(player,new THREE.Vector3(target.x,0,target.y))}}el.addEventListener('pointerdown',e=>{pid=e.pointerId;el.setPointerCapture(pid);const r=el.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;set(e)});el.addEventListener('pointermove',e=>{if(e.pointerId===pid)set(e)});el.addEventListener('pointerup',e=>{if(e.pointerId===pid){pid=null;target.x=target.y=0;if(isAim)target.active=false}})}
bindStick('move',move);bindStick('aim',aim,true);document.getElementById('super').addEventListener('pointerdown',()=>shoot(player,player.aim,true));
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='e')shoot(player,player.aim,true)});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);const pl=new THREE.Plane(new THREE.Vector3(0,1,0),0),pt=new THREE.Vector3();ray.ray.intersectPlane(pl,pt);if(pt){player.aim.copy(pt).sub(player.g.position).setY(0).normalize();shoot(player,player.aim)}}});
function updateFighter(f,dt){if(f.dead){f.respawn-=dt;if(f.respawn<=0){f.dead=false;f.hp=f.maxHp;f.ammo=3;f.g.visible=true;f.g.position.set(f.team===0?0:(Math.random()-.5)*14,0,f.team===0?12:-12)}return}if(f.ammo<3){f.reload+=dt;if(f.reload>1.1){f.ammo++;f.reload=0}}if(f.flash>0)f.flash-=dt;f.g.traverse(o=>{if(o.material&&o.material.emissive)o.material.emissive.setHex(f.flash>0?0xffffff:0x000000)});f.g.rotation.y=Math.atan2(f.aim.x,f.aim.z);f.legs[0].rotation.z=Math.sin(performance.now()*.012)*.08*Math.min(1,f.vel.length()/5);f.legs[1].rotation.z=-f.legs[0].rotation.z}
function moveFighter(f,dx,dz,dt,speed=6.5){const l=Math.hypot(dx,dz);if(l>.05){dx/=Math.max(1,l);dz/=Math.max(1,l);const nx=f.g.position.x+dx*speed*dt,nz=f.g.position.z+dz*speed*dt;if(!collides(nx,f.g.position.z))f.g.position.x=nx;if(!collides(f.g.position.x,nz))f.g.position.z=nz;f.vel.set(dx*speed,0,dz*speed)}else f.vel.multiplyScalar(.7)}
function botAI(b,dt){if(b.dead)return;const to=player.g.position.clone().sub(b.g.position);const d=to.length();b.aim.copy(to).setY(0).normalize();let strafe=Math.sin(performance.now()*.0014+b.ai*2.1);if(d>8)moveFighter(b,to.x,to.z,dt,4.8);else if(d<5)moveFighter(b,-to.x+strafe*2,-to.z,dt,4.8);else moveFighter(b,-to.z*strafe,to.x*strafe,dt,4.2);if(d<13&&Math.random()<dt*.9)shoot(b,b.aim);b.ai+=dt}
function update(dt){if(!running)return;timeLeft=Math.max(0,timeLeft-dt);if(timeLeft<=0)return finish();let dx=move.x+(keys.d?1:0)-(keys.a?1:0),dz=move.y+(keys.s?1:0)-(keys.w?1:0);moveFighter(player,dx,dz,dt,6.8);if(Math.hypot(aim.x,aim.y)>.18)player.aim.set(aim.x,0,aim.y).normalize();updateFighter(player,dt);for(const b of bots){botAI(b,dt);updateFighter(b,dt)}for(let i=projectiles.length-1;i>=0;i--){const p=projectiles[i];p.life-=dt;p.m.position.addScaledVector(p.d,p.speed*dt);if(p.life<=0||collides(p.m.position.x,p.m.position.z,.15)){scene.remove(p.m);projectiles.splice(i,1);continue}const targets=p.team===0?bots:[player];let hit=false;for(const t of targets){if(t.dead)continue;if(p.m.position.distanceTo(t.g.position.clone().add(new THREE.Vector3(0,1,0)))<1.0){damage(t,p.damage,p.owner);hit=true;break}}if(hit){scene.remove(p.m);projectiles.splice(i,1)}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.v.y-=8*dt;p.m.position.addScaledVector(p.v,dt);p.m.scale.setScalar(Math.max(0,p.life/.45));if(p.life<=0){scene.remove(p.m);particles.splice(i,1)}}camera.position.x+=(player.g.position.x*.22-camera.position.x)*dt*2;camera.position.z+=(player.g.position.z+22-camera.position.z)*dt*2;camera.lookAt(player.g.position.x*.2,0,player.g.position.z*.2);document.getElementById('hpFill').style.width=(Math.max(0,player.hp)/player.maxHp*100)+'%';document.getElementById('hpText').textContent=Math.max(0,Math.round(player.hp));document.querySelectorAll('#ammo i').forEach((el,i)=>el.classList.toggle('off',i>=player.ammo));const sb=document.getElementById('super');sb.classList.toggle('ready',player.super>=100);sb.textContent=player.super>=100?'⚡':Math.floor(player.super)+'%';document.getElementById('timer').textContent=Math.floor(timeLeft/60)+':'+String(Math.floor(timeLeft%60)).padStart(2,'0')}
function finish(){running=false;const e=bots.reduce((s,b)=>s+b.score,0);document.getElementById('endTitle').textContent=player.score>=e?'SEGER!':'FÖRLUST';document.getElementById('endText').textContent=`Du ${player.score} – ${e} Bots`;document.getElementById('end').classList.add('show')}
function reset(){player.score=0;player.hp=player.maxHp;player.ammo=3;player.super=0;player.dead=false;player.g.visible=true;player.g.position.set(0,0,12);bots.forEach((b,i)=>{b.score=0;b.hp=b.maxHp;b.ammo=3;b.dead=false;b.g.visible=true;b.g.position.set([-9,0,9][i],0,-11+(i%2)*2)});document.getElementById('pScore').textContent='0';document.getElementById('eScore').textContent='0';timeLeft=90;running=true;document.getElementById('end').classList.remove('show');const bn=document.getElementById('banner');bn.classList.add('show');setTimeout(()=>bn.classList.remove('show'),900)}
document.getElementById('play').onclick=()=>{document.getElementById('start').style.display='none';reset()};document.getElementById('again').onclick=reset;
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>

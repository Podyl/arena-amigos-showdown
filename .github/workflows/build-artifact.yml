name: Build Arena Amigos Standalone

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-artifact.yml'
      - 'standalone-index.html'
      - 'src/standalone.tsx'
      - 'vite.standalone.config.ts'
      - 'src/components/game/**'
      - 'src/styles.css'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build standalone static game
        run: bunx vite build --config vite.standalone.config.ts
      - name: Verify index exists
        run: test -f standalone-dist/standalone-index.html
      - name: Upload standalone site
        uses: actions/upload-artifact@v4
        with:
          name: arena-amigos-standalone-site
          path: standalone-dist
          if-no-files-found: error

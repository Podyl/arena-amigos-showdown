name: Test Arena Zero in Chromium
on:
  workflow_dispatch:
  push:
    branches: [arena-zero]
    paths:
      - 'arena-zero.html'
      - '.github/workflows/test-arena-zero.yml'
permissions:
  contents: read
jobs:
  visual-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Open game, start match, move and fire
        run: |
          cat > test.mjs <<'JS'
          import { chromium } from 'playwright';
          import { pathToFileURL } from 'url';
          import path from 'path';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:844,height:390},isMobile:true,hasTouch:true});
          const errors=[];
          page.on('pageerror',e=>errors.push('PAGEERROR: '+e.message));
          page.on('console',m=>{if(m.type()==='error') errors.push('CONSOLE: '+m.text())});
          const url=pathToFileURL(path.resolve('arena-zero.html')).href;
          await page.goto(url,{waitUntil:'load'});
          await page.screenshot({path:'menu.png'});
          await page.click('#play');
          await page.waitForTimeout(600);
          const canvas=page.locator('#game');
          const box=await canvas.boundingBox();
          if(!box) throw new Error('Game canvas missing');
          const left=page.locator('#leftJoy');
          const lb=await left.boundingBox();
          if(!lb) throw new Error('Left joystick missing');
          await page.mouse.move(lb.x+lb.width/2,lb.y+lb.height/2);
          await page.mouse.down();
          await page.mouse.move(lb.x+lb.width*.82,lb.y+lb.height*.5,{steps:5});
          await page.waitForTimeout(500);
          await page.mouse.up();
          const right=page.locator('#rightJoy');
          const rb=await right.boundingBox();
          if(!rb) throw new Error('Right joystick missing');
          await page.mouse.move(rb.x+rb.width/2,rb.y+rb.height/2);
          await page.mouse.down();
          await page.mouse.move(rb.x+rb.width*.5,rb.y+rb.height*.15,{steps:5});
          await page.waitForTimeout(500);
          await page.mouse.up();
          await page.screenshot({path:'match.png'});
          const hudVisible=await page.locator('#hud').isVisible();
          const menuVisible=await page.locator('#menu').isVisible();
          console.log('HUD_VISIBLE='+hudVisible);
          console.log('MENU_VISIBLE='+menuVisible);
          console.log('ERROR_COUNT='+errors.length);
          for(const e of errors) console.log(e);
          if(!hudVisible||menuVisible||errors.length) process.exitCode=1;
          await browser.close();
          JS
          node test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-zero-visual-test
          path: |
            menu.png
            match.png
          if-no-files-found: warn

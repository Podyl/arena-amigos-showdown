name: Fix Phaser runtime collision

on:
  push:
    branches: [brawl-rebuild]
    paths:
      - '.github/workflows/fix-runtime.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: brawl-rebuild
      - name: Rename Scene method that collides with Phaser.Scene.make
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/game/PhaserBrawlerFixed.tsx')
          s = p.read_text()
          s = s.replace('this.make("blue"', 'this.makeFighter("blue"')
          s = s.replace('this.make("red"', 'this.makeFighter("red"')
          s = s.replace('\n  make(team:Team,pick:Pick,pos:{x:number;y:number},human:boolean){', '\n  makeFighter(team:Team,pick:Pick,pos:{x:number;y:number},human:boolean){')
          p.write_text(s)
          if 'this.make("' in s or '\n  make(team:Team' in s:
              raise SystemExit('rename did not fully apply')
          PY
      - name: Commit runtime fix
        run: |
          git config user.name "Arena Amigos Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/game/PhaserBrawlerFixed.tsx
          git commit -m "Fix Phaser fighter spawn runtime crash"
          git push origin brawl-rebuild

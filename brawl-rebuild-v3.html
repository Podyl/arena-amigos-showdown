function updateHUD(){$('hpFill').style.width=`${Math.max(0,player.userData.hp/player.userData.maxHp*100)}%`;$('hpText').textContent=Math.ceil(player.userData.hp);[...$('ammo').children].forEach((e,i)=>e.classList.toggle('off',i>=player.userData.ammo));$('superBtn').classList.toggle('ready',player.userData.super>=100);$('superBtn').textContent=player.userData.super>=100?'⚡':Math.floor(player.userData.super)}
function resize(){const w=innerWidth,h=innerHeight,asp=w/h,s=8.2;camera.left=-s*asp;camera.right=s*asp;camera.top=s;camera.bottom=-s;camera.updateProjectionMatrix();renderer.setSize(w,h)}window.addEventListener('resize',resize);resize();
function bindJoy(el,target,isAim){const knob=el.querySelector('.knob');let pid=null,startAt=0;const apply=e=>{const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.32,dist=Math.hypot(dx,dy)||1,k=Math.min(1,max/dist),px=dx*k,py=dy*k;knob.style.transform=`translate(${px}px,${py}px)`;target.x=px/max;target.y=isAim?py/max:-py/max;if(isAim){target.drag=Math.min(1,dist/max);showAim(target.x,target.y)}};el.addEventListener('pointerdown',e=>{e.preventDefault();pid=e.pointerId;startAt=performance.now();el.setPointerCapture(pid);apply(e)});el.addEventListener('pointermove',e=>{if(e.pointerId!==pid)return;e.preventDefault();apply(e)});const end=e=>{if(e.pointerId!==pid)return;e.preventDefault();if(isAim){const held=performance.now()-startAt;if(target.drag<.24&&held<260)autoAim();else if(target.drag>.2)firePlayer(target.x,target.y);hideAim()}pid=null;target.x=target.y=0;if(isAim)target.drag=0;knob.style.transform='translate(0,0)'};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}
function showAim(x,y){const l=$('aimLine'),len=110+Math.hypot(x,y)*80,ang=Math.atan2(y,x);l.style.display='block';l.style.width=len+'px';l.style.left='50%';l.style.top='50%';l.style.transform=`rotate(${ang}rad)`}function hideAim(){$('aimLine').style.display='none'}
bindJoy($('moveJoy'),moveInput,false);bindJoy($('aimJoy'),aimInput,true);$('superBtn').addEventListener('pointerdown',e=>{e.preventDefault();useSuper()});$('playBtn').addEventListener('click',()=>{startScreen.style.display='none';playing=true;showBanner('BRAWL!')});window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')useSuper();if(e.code==='Space')autoAim()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function showBanner(text){const b=$('banner');b.textContent=text;b.classList.add('show');setTimeout(()=>b.classList.remove('show'),900)}
function finish(){playing=false;const win=blueScore>=redScore;$('resultTitle').textContent=win?'SEGER!':'FÖRLUST';$('resultText').textContent=`BLÅ ${blueScore} – ${redScore} RÖD`;endScreen.classList.add('show')}
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.033,(now-lastT)/1000);lastT=now;if(playing){timeLeft-=dt;if(timeLeft<=0){timeLeft=0;finish()}updatePlayer(dt);for(const f of fighters)updateFighter(f,dt);updateShots(dt);updateParticles(dt);crystal.rotation.y+=dt*1.8;crystal.position.y=1.25+Math.sin(now/420)*.12;camera.position.x=THREE.MathUtils.lerp(camera.position.x,player.position.x+10,.05);camera.position.z=THREE.MathUtils.lerp(camera.position.z,player.position.z+17,.05);camera.lookAt(player.position.x,0,player.position.z);$('timer').textContent=`${Math.floor(timeLeft/60)}:${String(Math.floor(timeLeft%60)).padStart(2,'0')}`;updateHUD()}renderer.render(scene,camera)}requestAnimationFrame(frame);updateHUD();
</script>
</body></html>
